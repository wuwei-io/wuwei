# wuwei 版打包配置：与 minicc 完全隔离（不同 appId / 数据目录 / 安装包名）。
# 用法: npx electron-builder --config electron-builder.wuwei.yml
appId: com.wuwei.app
productName: wuwei
directories:
  output: release
files:
  - out/**/*
  - build/icon.png
  - build/tray.ico
  - package.json
asarUnpack:
  - build/icon.png
  - build/tray.ico
  - "**/node_modules/@anthropic-ai/**"
  - "**/node_modules/onnxruntime-node/**"
  - "**/node_modules/@xenova/**"
mac:
  hardenedRuntime: true
  notarize: true # notarytool + automatic stapling; CI rejects missing credentials
  target:
    - target: dmg # 用户下载安装用
      arch: [x64, arm64]
    - target: zip # electron-updater 自动更新用（mac 只能从 zip 增量更新，不能从 dmg）
      arch: [x64, arm64]
  icon: build/icon.png
  category: public.app-category.developer-tools
dmg:
  sign: true
  title: "wuwei ${version}"
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icon.png
  category: Development
  maintainer: wuwei
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # 关闭 electron-updater 的 Windows 验签：从「未签名(≤1.6.19)」升到「EV 签名(1.6.20+)」时，
  # 默认验签会因发布者不匹配而静默失败 → 用户永远收不到更新提示。安装包完整性仍由 latest.yml 的
  # sha512 校验保证（下载源是自家 OSS + HTTPS），关掉发布者验签只是让签名切换/证书续期不再卡更新。
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: "wuwei-${version}-setup.${ext}"
  # 覆盖「应用是否在运行」检测：electron-builder 默认实现的 PowerShell 分支漏了排除
  # 安装程序自身 PID，安装包一旦位于安装目录下就会自己撞自己、点重试也过不去。
  # 顺带把关不掉时的提示改成可操作的（托盘右键退出）。详见文件内注释。
  include: build/installer.nsh
npmRebuild: false
# GitHub hosts manifests, installers, macOS update ZIPs and differential maps.
# The generic provider avoids GitHub API rate limits for anonymous clients.
# Legacy OSS/R2 feeds retain only small manifests pointing at the same GitHub assets.
publish:
  provider: generic
  url: https://github.com/wuwei-io/wuwei/releases/latest/download/
  useMultipleRangeRequest: false
  channel: latest

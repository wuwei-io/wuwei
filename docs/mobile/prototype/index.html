<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无为手机端 · 高保真 v3 全量</title>
<style>
:root{
  --bg:#ffffff; --bg-soft:#f4f6f8; --bg-raised:#eef1f4; --bg-input:#f4f6f8;
  --border:#e0e4e8; --border-strong:#cfd5db;
  --text:#16191e; --text-dim:#5b656d; --text-muted:#5b656d; --text-faint:#8a929a;
  --accent:#274a63; --accent-soft:rgba(39,74,99,.10);
  --spark:#c05f3c; --spark-soft:rgba(192,95,60,.12);
  --green:#3f8f6b; --green-bg:rgba(63,143,107,.12);
  --red:#e5484d; --red-bg:rgba(229,72,77,.10);
  --warn:#c8933f; --gold:#c9a24b; --unread:#e5484d;
  --code-bg:#f4f6f8;
  --sans:Inter,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono","SF Mono",Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
body{background:#dde2e7;font-family:var(--sans);color:var(--text);padding:40px 20px 80px;}
.page-title{text-align:center;color:var(--text);margin-bottom:6px;font-size:22px;font-weight:750;letter-spacing:.5px;}
.page-sub{text-align:center;color:var(--text-muted);font-size:13px;margin-bottom:10px;}
.group-title{max-width:1300px;margin:44px auto 20px;font-size:16px;font-weight:750;color:var(--text);border-left:4px solid var(--spark);padding-left:12px;letter-spacing:.5px;}
.group-title span{font-weight:400;color:var(--text-muted);font-size:13px;margin-left:8px;}
.frames{display:flex;gap:44px;justify-content:flex-start;flex-wrap:wrap;align-items:flex-start;max-width:1300px;margin:0 auto;}
.frame-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;}
.frame-label{color:var(--text-dim);font-size:13px;font-weight:600;letter-spacing:.3px;}
.frame-label span{color:var(--text-faint);font-weight:400;font-size:11.5px;}
.phone{width:375px;height:812px;background:var(--bg);border-radius:44px;border:10px solid #1c1f24;position:relative;overflow:hidden;box-shadow:0 24px 60px -18px rgba(30,40,55,.35);}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:30px;background:#23272e;border-radius:0 0 18px 18px;z-index:50;}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;}
.statusbar{height:47px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-size:14px;font-weight:600;flex:0 0 auto;z-index:10;}
.statusbar .icons{display:flex;gap:6px;align-items:center;}
.navbar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex:0 0 auto;}
.navbar .title{font-size:18px;font-weight:750;letter-spacing:.3px;}
.navbar .big-title{font-size:24px;font-weight:800;}
.nav-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--text-dim);background:var(--bg-raised);cursor:pointer;}
.nav-btn.plain{background:none;}
.nav-back{color:var(--text-dim);font-size:22px;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;}
.nav-text{font-size:14.5px;color:var(--accent);font-weight:600;cursor:pointer;}
.content{flex:1 1 auto;overflow-y:auto;padding:4px 16px 16px;}
.content::-webkit-scrollbar{width:0;}
.tabbar{flex:0 0 auto;height:78px;background:var(--bg-soft);border-top:1px solid var(--border);display:flex;padding-bottom:20px;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-muted);font-size:10.5px;font-weight:500;position:relative;cursor:pointer;}
.tab.on{color:var(--accent);}
.tab .dot{position:absolute;top:8px;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;background:var(--unread);border-radius:8px;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg-soft);}
.i{width:24px;height:24px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.search{display:flex;align-items:center;gap:8px;background:var(--bg-raised);border-radius:12px;padding:10px 14px;margin:6px 0 16px;color:var(--text-muted);font-size:14px;}
.sec-label{font-size:12px;color:var(--text-muted);font-weight:600;margin:14px 2px 8px;letter-spacing:.5px;}
.chat-item{display:flex;gap:12px;padding:13px 12px;border-radius:14px;margin-bottom:6px;cursor:pointer;}
.chat-item:active{background:var(--bg-soft);}
.avatar{width:46px;height:46px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;font-size:20px;font-weight:700;color:#fff;position:relative;}
.av-sm{width:38px;height:38px;border-radius:11px;font-size:16px;}
.av-lg{width:64px;height:64px;border-radius:18px;font-size:26px;}
.av-accent{background:linear-gradient(135deg,#7fb0be,#5b8a98);}
.av-spark{background:linear-gradient(135deg,#d9714a,#c05f3c);}
.av-green{background:linear-gradient(135deg,#6fa088,#5c8a73);}
.av-gold{background:linear-gradient(135deg,#d4b25e,#a97f2e);}
.av-plum{background:linear-gradient(135deg,#b083a8,#8a5f83);}
.run-dot{position:absolute;bottom:-1px;right:-1px;width:13px;height:13px;border-radius:50%;background:var(--accent);border:2.5px solid var(--bg);animation:pulse 1.3s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.45;transform:scale(.82);}}
.chat-main{flex:1;min-width:0;}
.chat-row1{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
.chat-name{font-size:15.5px;font-weight:650;}
.chat-time{font-size:12px;color:var(--text-faint);flex:0 0 auto;margin-left:8px;}
.chat-msg{font-size:13.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4;}
.chat-msg .running{color:var(--accent);font-weight:600;}
.chat-dev{display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:2px 8px;background:var(--bg-soft);border-radius:999px;font-size:11px;color:var(--text-faint);}
.chat-dev svg{stroke:var(--text-faint);stroke-width:2;fill:none;}
/* ===== 对话列表·在线电脑入口 ===== */
.device-entry{margin:8px 0 4px;}
.de-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.de-title{font-size:12px;color:var(--text-muted);font-weight:700;}
.de-more{font-size:12px;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:2px;cursor:pointer;}
.de-more svg{stroke:var(--accent);stroke-width:2;fill:none;}
.de-rows{display:flex;flex-direction:column;gap:8px;}
.de-row{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--border);border-radius:13px;background:var(--bg-soft);cursor:pointer;}
.de-row > svg:last-child{stroke:var(--text-faint);stroke-width:2;fill:none;flex:0 0 auto;}
.de-ic{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;flex:0 0 auto;}
.de-ic svg{stroke:var(--accent);stroke-width:1.8;fill:none;}
.de-info{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
.de-name{font-size:14px;font-weight:700;color:var(--text);}
.de-sub{font-size:11.5px;color:var(--text-muted);display:flex;align-items:center;gap:4px;}
.fab{position:absolute;bottom:96px;right:20px;width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,#d9714a,#c05f3c);display:grid;place-items:center;box-shadow:0 8px 22px -4px rgba(192,95,60,.55);color:#fff;z-index:20;cursor:pointer;}
.msg-flow{display:flex;flex-direction:column;gap:16px;padding:8px 0;}
.msg-row{display:flex;gap:10px;}
.msg-row.user{justify-content:flex-end;}
.bubble-user{background:var(--accent-soft);color:var(--text);border-radius:15px;border-bottom-right-radius:5px;padding:11px 14px;max-width:74%;font-size:15px;line-height:1.55;}
.ai-av{width:30px;height:30px;border-radius:9px;flex:0 0 auto;background:linear-gradient(135deg,#7fb0be,#5b8a98);display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;}
.ai-body{flex:1;min-width:0;}
.ai-name{font-size:12.5px;color:var(--text-muted);font-weight:600;margin-bottom:5px;}
.ai-text{font-size:15px;line-height:1.6;color:var(--text);}
/* 边界提示条：手机端做不了的本地重活，平静告知+引导去电脑端（info 中性层级，非危险红） */
.boundary-note{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border:1px solid rgba(39,74,99,.22);border-radius:12px;padding:11px 13px;margin:4px 0;}
.boundary-note .bn-ico{width:20px;height:20px;flex:0 0 auto;color:var(--accent);margin-top:1px;}
.boundary-note .bn-body{flex:1;min-width:0;}
.boundary-note .bn-title{font-size:13px;font-weight:650;color:var(--accent);margin-bottom:3px;}
.boundary-note .bn-text{font-size:12.5px;color:var(--text-dim);line-height:1.6;}
.boundary-note .bn-text b{color:var(--text);font-weight:650;}
/* 远程操控状态条：顶部常驻，标明正在遥控哪台电脑（续聊=灵魂功能） */
.remote-ctrl-bar{display:flex;align-items:center;gap:8px;padding:7px 16px;background:var(--accent-soft);border-bottom:1px solid rgba(39,74,99,.18);}
.remote-ctrl-bar .rc-text{font-size:12px;color:var(--accent);} .remote-ctrl-bar .rc-text b{font-weight:700;}
.remote-ctrl-bar .rc-tag{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--accent);background:#fff;border:1px solid rgba(39,74,99,.25);border-radius:20px;padding:2px 9px;}
.remote-relay-note{flex:0 0 auto;font-size:10px;color:var(--text-faint);text-align:center;padding:0 16px 8px;line-height:1.4;}
.tool-row{display:flex;align-items:center;gap:8px;background:var(--bg-raised);border:1px solid var(--border);border-radius:10px;padding:9px 12px;margin:8px 0;font-family:var(--mono);font-size:12.5px;cursor:pointer;}
.tool-name{color:var(--text-dim);}
.tool-cmd{color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.tool-status{font-size:11px;padding:1px 6px;border-radius:5px;flex:0 0 auto;}
.st-ok{color:var(--green);background:var(--green-bg);}
.st-run{color:var(--accent);background:var(--accent-soft);}
.spin{width:13px;height:13px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:0 0 auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.input-bar{flex:0 0 auto;border-top:1px solid var(--border);background:var(--bg-soft);padding:10px 14px 26px;display:flex;align-items:flex-end;gap:10px;}
.input-box{flex:1;background:var(--bg-input);border:1px solid var(--border);border-radius:20px;padding:10px 16px;font-size:15px;color:var(--text-muted);min-height:42px;display:flex;align-items:center;}
.send-btn{width:42px;height:42px;border-radius:50%;background:var(--spark);display:grid;place-items:center;color:#fff;flex:0 0 auto;cursor:pointer;box-shadow:0 3px 10px rgba(192,95,60,.35);}
.stop-btn{width:42px;height:42px;border-radius:50%;background:var(--bg-raised);border:1px solid var(--border-strong);display:grid;place-items:center;color:var(--red);flex:0 0 auto;}
.task-head{background:var(--bg-raised);border:1px solid var(--border);border-radius:16px;padding:16px;margin:8px 0 18px;}
.task-title{font-size:18px;font-weight:750;margin-bottom:10px;line-height:1.35;}
.task-meta{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;font-weight:600;}
.pill-run{color:var(--accent);background:var(--accent-soft);}
.pill-done{color:var(--green);background:var(--green-bg);}
.pill-queue{color:var(--text-muted);background:var(--bg-raised);border:1px solid var(--border);}
.pill-owner{display:flex;align-items:center;gap:6px;color:var(--text-dim);font-size:12.5px;}
.mini-av{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;}
.prog-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-muted);margin-bottom:6px;}
.prog-bar{height:7px;background:var(--border);border-radius:4px;overflow:hidden;}
.prog-fill{height:100%;border-radius:4px;background:var(--accent);}
.output-card{display:flex;align-items:center;gap:12px;background:var(--bg-raised);border:1px solid var(--border);border-radius:12px;padding:13px;margin-top:6px;cursor:pointer;}
.out-ico{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);flex:0 0 auto;}
.bottom-actions{flex:0 0 auto;border-top:1px solid var(--border);background:var(--bg-soft);padding:12px 16px 28px;display:flex;gap:10px;}
.btn{flex:1;height:46px;border-radius:12px;font-size:15px;font-weight:650;display:grid;place-items:center;cursor:pointer;border:none;}
.btn-primary{background:var(--spark);color:#fff;box-shadow:0 4px 12px rgba(192,95,60,.3);}
.btn-ghost{background:transparent;border:1px solid var(--border-strong);color:var(--text-dim);}
.btn-danger{background:transparent;border:1px solid var(--red);color:var(--red);}
.btn-full{width:100%;height:50px;border-radius:14px;font-size:16px;font-weight:700;border:none;cursor:pointer;display:grid;place-items:center;}
.risk-badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;padding:5px 14px;border-radius:999px;}
.risk-high{color:var(--red);background:var(--red-bg);}
.risk-mid{color:var(--warn);background:rgba(200,147,63,.16);}
.detail-card{background:var(--bg-raised);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;}
.detail-label{font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:8px;letter-spacing:.3px;}
.cmd-view{background:var(--code-bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-family:var(--mono);font-size:12.5px;color:#3a4550;line-height:1.6;word-break:break-all;}
.cmd-view .danger{color:var(--red);}
.empty-guide{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;height:100%;padding:0 40px;gap:6px;}
.guide-logo{margin:0 auto 14px;display:grid;place-items:center;}
.guide-logo svg{display:block;}
.guide-title{font-size:17px;font-weight:700;}
.guide-desc{font-size:14px;color:var(--text-muted);line-height:1.6;margin-bottom:20px;}
.guide-btn{background:var(--spark);color:#fff;padding:12px 32px;border-radius:999px;font-size:15px;font-weight:650;box-shadow:0 4px 14px rgba(192,95,60,.35);cursor:pointer;}
.guide-btn.ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border-strong);box-shadow:none;}
.card{background:var(--bg-raised);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;}
.seg{display:flex;background:var(--bg-raised);border-radius:12px;padding:3px;margin:6px 0 14px;}
.seg .s{flex:1;text-align:center;font-size:13px;font-weight:600;color:var(--text-muted);padding:7px 0;border-radius:9px;cursor:pointer;}
.seg .s.on{background:var(--bg);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.06);}
.list-row{display:flex;align-items:center;gap:13px;padding:14px 4px;border-bottom:1px solid var(--border);cursor:pointer;}
.list-row:last-child{border-bottom:none;}
.list-ico{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);flex:0 0 auto;}
.list-main{flex:1;min-width:0;}
.list-t{font-size:15px;font-weight:600;}
.list-d{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
.list-r{color:var(--text-faint);font-size:13px;flex:0 0 auto;display:flex;align-items:center;gap:6px;}
.switch{width:44px;height:26px;border-radius:999px;background:var(--accent);position:relative;flex:0 0 auto;}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.switch.off{background:var(--border-strong);}
.switch.off::after{right:auto;left:3px;}
.field{background:var(--bg-soft);border:1px solid var(--border);border-radius:12px;padding:14px 16px;font-size:15px;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.field .ph{color:var(--text-faint);}
.field-code{display:flex;gap:10px;margin-bottom:18px;}
.code-cell{flex:1;height:56px;background:var(--bg-soft);border:1.5px solid var(--border);border-radius:12px;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--text);}
.code-cell.active{border-color:var(--accent);}
.link-c{color:var(--accent);font-size:13.5px;font-weight:600;cursor:pointer;}
.agree-link{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px;cursor:pointer;}
/* 协议/隐私全文阅读页 */
.doc-body{font-size:13px;color:var(--text-dim);line-height:1.75;padding-bottom:8px;}
.doc-meta{font-size:12px;color:var(--text-faint);margin:2px 0 16px;}
.doc-h{font-size:14.5px;font-weight:700;color:var(--text);margin:18px 0 6px;}
.doc-h:first-of-type{margin-top:4px;}
.doc-p{margin-bottom:4px;}
.oauth-ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;box-shadow:0 2px 8px -2px rgba(30,40,55,.15);}
.oauth-lb{font-size:11.5px;color:var(--text-muted);font-weight:500;}
/* 余额 = 只读卡（合规：不做支付入口，不用高饱和主色/诱导点击） */
.wallet{background:var(--bg-raised);border:1px solid var(--border);border-radius:16px;padding:16px 18px;color:var(--text);margin:8px 0 16px;}
.wallet-head{display:flex;align-items:center;justify-content:space-between;}
.wallet-label{font-size:12.5px;color:var(--text-muted);font-weight:600;}
.wallet-readonly{font-size:10.5px;color:var(--text-faint);background:var(--bg-soft);border:1px solid var(--border);padding:2px 8px;border-radius:999px;font-weight:600;}
.wallet-bal{font-size:30px;font-weight:800;margin:4px 0 2px;color:var(--text);}
.wallet-hint{font-size:11.5px;color:var(--text-faint);line-height:1.5;background:var(--bg-soft);border-radius:8px;padding:8px 10px;margin-top:10px;}
.pro-card{background:linear-gradient(135deg,#d4b25e,#a97f2e);border-radius:16px;padding:16px;color:#fff;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.chip{font-size:12.5px;padding:5px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;}
.timeline{position:relative;padding-left:26px;}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:14px;width:2px;background:var(--border);}
.tl-item{position:relative;padding-bottom:18px;}
.tl-dot{position:absolute;left:-24px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--border-strong);}
.tl-item.done .tl-dot{background:var(--green);border-color:var(--green);}
.tl-item.now .tl-dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
.tl-time{font-size:11.5px;color:var(--text-faint);margin-bottom:3px;}
.tl-title{font-size:14.5px;font-weight:600;}
.drawer-mask{position:absolute;inset:0;background:rgba(20,25,32,.35);z-index:30;display:flex;align-items:flex-end;}
.drawer{width:100%;background:var(--bg);border-radius:20px 20px 0 0;padding:10px 16px 28px;max-height:70%;overflow-y:auto;}
.drawer-handle{width:40px;height:4px;border-radius:2px;background:var(--border-strong);margin:2px auto 14px;}
.kv{display:flex;justify-content:space-between;font-size:13.5px;padding:9px 0;border-bottom:1px solid var(--border);}
.kv .k{color:var(--text-muted);}
.kv .v{color:var(--text);font-weight:600;font-family:var(--mono);}
.note{max-width:1300px;margin:44px auto 0;background:var(--bg-raised);border:1px solid var(--border);border-radius:14px;padding:20px 24px;color:var(--text-dim);font-size:13.5px;line-height:1.8;}
.note h3{color:var(--text);font-size:15px;margin-bottom:10px;}
.note b{color:var(--accent);}
/* ===== B2 对话详情增强：余量条 / 模型胶囊 / bottom sheet / 更多气泡 ===== */
/* 余量条：横排三段 mini 条（5h 剩 / 本周剩 / 上下文），一行放清爽 */
.quota-strip{display:flex;align-items:center;gap:14px;padding:8px 16px 9px;background:var(--bg);border-bottom:1px solid var(--border);flex:0 0 auto;}
.qseg{flex:1;min-width:0;}
.qseg-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;}
.qseg-label{font-size:10.5px;color:var(--text-muted);font-weight:600;white-space:nowrap;}
.qseg-num{font-size:10.5px;font-weight:700;white-space:nowrap;margin-left:4px;}
.quota-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.quota-fill{height:100%;border-radius:3px;transition:width .3s;}
.qf-ok{background:var(--accent);}      /* 剩余 ≥50% 靛青 */
.qf-warn{background:var(--gold);}       /* 剩余 <50% 暖金提醒 */
.qf-low{background:var(--red);}         /* 剩余快用尽 朱红 */
.qn-ok{color:var(--accent);} .qn-warn{color:var(--gold);} .qn-low{color:var(--red);}
.model-pill{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;margin:0 0 8px;padding:6px 12px;background:var(--bg-raised);border:1px solid var(--border);border-radius:999px;font-size:12.5px;color:var(--text-dim);font-weight:600;cursor:pointer;}
.model-pill .mdot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:0 0 auto;}
.model-pill .mname{color:var(--text);}
.model-pill svg{width:14px;height:14px;color:var(--text-faint);}
.input-stack{flex:0 0 auto;border-top:1px solid var(--border);background:var(--bg-soft);padding:8px 14px 22px;}
.input-stack .row2{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.input-line{display:flex;align-items:flex-end;gap:8px;}
.ic-btn{width:40px;height:40px;border-radius:50%;background:var(--bg-raised);border:1px solid var(--border);display:grid;place-items:center;color:var(--text-dim);flex:0 0 auto;cursor:pointer;}
.sheet{width:100%;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 0 24px;max-height:74%;overflow-y:auto;}
.sheet-title{font-size:16px;font-weight:750;padding:10px 20px 6px;}
.sheet-sub{font-size:12.5px;color:var(--text-muted);padding:0 20px 8px;}
.model-opt{display:flex;align-items:center;gap:12px;padding:13px 20px;cursor:pointer;}
.model-opt:active{background:var(--bg-soft);}
.model-opt .mo-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;flex:0 0 auto;}
.model-opt .mo-main{flex:1;min-width:0;}
.model-opt .mo-name{font-size:14.5px;font-weight:650;}
.model-opt .mo-desc{font-size:12px;color:var(--text-muted);margin-top:2px;}
.model-opt .mo-cost{font-size:11.5px;color:var(--text-faint);flex:0 0 auto;}
.model-opt .mo-check{color:var(--accent);flex:0 0 auto;}
.img-msg{border-radius:14px;overflow:hidden;max-width:70%;border:1px solid var(--border);}
.img-ph{width:180px;height:120px;background:linear-gradient(135deg,#dfe6ec,#c8d3db);display:grid;place-items:center;color:var(--text-faint);font-size:12px;}
.code-block{background:var(--code-bg);border:1px solid var(--border);border-radius:12px;margin:8px 0;overflow:hidden;}
.code-block .cb-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:11.5px;color:var(--text-muted);}
.code-block .cb-body{padding:12px;font-family:var(--mono);font-size:12px;line-height:1.7;color:#3a4550;overflow-x:auto;}
.code-block .kw{color:var(--accent);} .code-block .st{color:var(--green);} .code-block .cm{color:var(--text-faint);}
/* ===== 两级模型 sheet · 执行位置 · 倍率 pill ===== */
.sheet-divider{height:8px;background:var(--bg-soft);margin:8px 0;}
.sheet-grouphd{font-size:12px;color:var(--text-muted);font-weight:700;padding:4px 20px 8px;}
.sheet-grouphd span{font-weight:400;color:var(--text-faint);margin-left:6px;}
.sheet-back{display:flex;align-items:center;gap:8px;padding:10px 16px 10px;font-size:16px;font-weight:750;}
.sheet-back .sb-ico{color:var(--text-dim);display:grid;place-items:center;}
.sheet-back .sb-sub{font-size:12px;font-weight:400;color:var(--text-faint);margin-left:4px;}
.sheet-foot{font-size:11px;color:var(--text-faint);padding:10px 20px 0;line-height:1.6;}
.model-opt.opt-on{background:var(--accent-soft);}
.model-opt svg{color:var(--text-faint);flex:0 0 auto;}
.mult{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;flex:0 0 auto;}
.mc-free{color:var(--green);background:var(--green-bg);}
.mc-accent{color:var(--accent);background:var(--accent-soft);}
.mc-spark{color:var(--spark);background:var(--spark-soft);}
.exec-sec{padding:4px 16px 2px;}
.exec-head{font-size:12px;color:var(--text-muted);font-weight:700;padding:4px 4px 8px;}
.exec-head span{font-weight:400;color:var(--text-faint);margin-left:6px;}
.exec-opt{display:flex;align-items:center;gap:11px;padding:11px 8px;border-radius:12px;cursor:pointer;}
.exec-opt.on{background:var(--accent-soft);}
.exec-ic{width:34px;height:34px;border-radius:10px;background:var(--bg-raised);display:grid;place-items:center;font-size:17px;flex:0 0 auto;}
.exec-ic.hosted{background:var(--spark-soft);}
.exec-main{flex:1;min-width:0;}
.exec-name{font-size:14px;font-weight:650;}
.exec-sub{font-size:11.5px;color:var(--text-muted);margin-top:2px;display:flex;align-items:center;gap:5px;}
.exec-link{font-size:11.5px;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:2px;flex:0 0 auto;}
.exec-link svg{width:14px;height:14px;color:var(--accent);}
.on-dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;flex:0 0 auto;}
/* ===== 新建对话·执行设备选择 ===== */
.dev-pick{display:flex;align-items:center;gap:11px;padding:12px 13px;border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:14px;cursor:pointer;}
.dev-ic{width:38px;height:38px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:0 0 auto;}
.dev-ic svg{stroke:#fff;stroke-width:1.8;fill:none;}
.dev-main{flex:1;min-width:0;}
.dev-name{font-size:14.5px;font-weight:700;color:var(--text);}
.dev-sub{font-size:11.5px;color:var(--text-muted);margin-top:3px;display:flex;align-items:center;gap:5px;}
.dev-pick > svg{stroke:var(--text-faint);stroke-width:2;fill:none;flex:0 0 auto;}
.dev-hint{font-size:11px;color:var(--text-faint);margin:7px 4px 4px;line-height:1.5;}
/* ===== 语音输入 ===== */
.voice-hint{position:absolute;bottom:92px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;font-size:12.5px;font-weight:600;padding:8px 16px;border-radius:999px;display:flex;align-items:center;gap:8px;white-space:nowrap;z-index:25;box-shadow:0 6px 18px -4px rgba(0,0,0,.3);}
.rec-dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1s ease-in-out infinite;}
.mic-hold{width:42px;height:42px;border-radius:50%;background:var(--spark);display:grid;place-items:center;color:#fff;flex:0 0 auto;box-shadow:0 0 0 6px var(--spark-soft);}
.toast-fail{position:absolute;bottom:108px;left:16px;right:16px;background:var(--red-bg);border:1px solid var(--red);color:var(--red);font-size:12.5px;font-weight:600;padding:10px 14px;border-radius:12px;display:flex;align-items:center;gap:8px;z-index:25;}
.toast-fail svg{color:var(--red);flex:0 0 auto;}
/* ===== 实时语音输入面板（边说边出字 + 实时声波 + 上滑取消）===== */
.voice-panel{flex:0 0 auto;border-top:1px solid var(--border);background:var(--bg-soft);padding:14px 16px 24px;}
.voice-panel.cancel{background:var(--red-bg);}
.vp-cancel-tip{text-align:center;font-size:12px;font-weight:600;color:var(--text-faint);margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:6px;}
.vp-cancel-tip.armed{color:var(--red);}
.vp-chevron{display:inline-block;animation:upfloat 1.2s ease-in-out infinite;}
@keyframes upfloat{0%,100%{transform:translateY(0);opacity:.5;}50%{transform:translateY(-3px);opacity:1;}}
/* 实时上屏文字（边说边填进输入区，灰=临时识别中/黑=已确认） */
.vp-live{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:12px 14px;min-height:54px;font-size:15px;line-height:1.55;color:var(--text);margin-bottom:12px;}
.vp-live .interim{color:var(--text-faint);}
.vp-live .caret{display:inline-block;width:2px;height:16px;background:var(--spark);vertical-align:-2px;margin-left:1px;animation:blink 1s step-end infinite;}
@keyframes blink{50%{opacity:0;}}
/* 声波：一排跳动竖条 */
.waveform{display:flex;align-items:center;justify-content:center;gap:3px;height:34px;flex:1;}
.waveform span{width:3px;border-radius:2px;background:var(--spark);animation:wave 1s ease-in-out infinite;}
@keyframes wave{0%,100%{height:6px;}50%{height:28px;}}
.voice-panel.cancel .waveform span{background:var(--red);opacity:.5;}
.vp-row{display:flex;align-items:center;gap:14px;}
.vp-stop{width:46px;height:46px;border-radius:50%;background:var(--spark);display:grid;place-items:center;color:#fff;flex:0 0 auto;box-shadow:0 4px 14px rgba(192,95,60,.4);}
.voice-panel.cancel .vp-stop{background:var(--red);box-shadow:none;}
.vp-x{width:40px;height:40px;border-radius:50%;background:var(--bg-raised);border:1px solid var(--border);display:grid;place-items:center;color:var(--text-dim);flex:0 0 auto;}
/* ===== 审批卡（真实字段）===== */
.appr-card{cursor:default;}
.appr-count{font-size:12px;font-weight:700;color:var(--text-muted);margin-left:auto;display:flex;align-items:center;gap:4px;font-family:var(--mono);}
.appr-count.low{color:var(--red);}
.appr-count svg{width:13px;height:13px;}
.appr-tool{font-size:15px;font-weight:650;margin-bottom:6px;}
.appr-toolname{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:600;}
.appr-dev{font-size:12.5px;color:var(--text-dim);margin-bottom:8px;}
.appr-param{font-family:var(--mono);font-size:12px;color:#3a4550;background:var(--code-bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;line-height:1.5;margin-bottom:10px;word-break:break-all;max-height:62px;overflow:hidden;}
.appr-ctx{font-size:12px;color:var(--text-muted);background:var(--accent-soft);border-radius:8px;padding:7px 10px;margin-bottom:8px;line-height:1.5;display:flex;flex-wrap:wrap;align-items:center;gap:5px;}
.appr-ctx-label{font-size:10.5px;font-weight:700;color:var(--accent);background:#fff;border:1px solid rgba(39,74,99,.25);border-radius:5px;padding:1px 6px;}
.appr-ctx-sep{color:var(--text-faint);}
.appr-view{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--accent);font-weight:600;padding:8px 0 12px;cursor:pointer;}
.appr-view svg{stroke:var(--accent);stroke-width:2;fill:none;}
.appr-view span{flex:1;}
.appr-btns{display:flex;gap:8px;}
/* ===== 决策审批（白话选择题，非审命令）===== */
.decide-q{font-size:14px;font-weight:700;color:var(--text);margin:10px 0 10px;line-height:1.5;}
.decide-opts{display:flex;flex-direction:column;gap:8px;}
.decide-opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:11px 13px;border:1px solid var(--border-strong);border-radius:11px;background:#fff;cursor:pointer;width:100%;}
.decide-opt:first-child{border-color:var(--accent);background:var(--accent-soft);}
.do-main{font-size:14px;font-weight:650;color:var(--text);}
.decide-opt:first-child .do-main{color:var(--accent);}
.do-sub{font-size:11.5px;color:var(--text-muted);}
.decide-foot{display:flex;align-items:center;gap:4px;justify-content:center;font-size:11.5px;color:var(--text-faint);margin-top:12px;cursor:pointer;}
.decide-foot svg{stroke:var(--text-faint);stroke-width:2;fill:none;}
/* ===== 决策审批·底部上拉弹窗 ===== */
.sheet-mask{position:absolute;inset:0;background:rgba(22,25,30,.42);z-index:30;}
.decide-sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;background:#fff;border-radius:22px 22px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px -8px rgba(22,25,30,.3);}
.sheet-grip{width:40px;height:5px;border-radius:3px;background:var(--border-strong);margin:0 auto 14px;}
.decide-sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.decide-sheet-head .risk-badge{font-size:12.5px;}
.decide-timer{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--red);font-family:var(--mono);}
.decide-timer svg{stroke:var(--red);stroke-width:2;fill:none;}
.decide-sheet-q{font-size:15px;font-weight:700;color:var(--text);line-height:1.55;margin-bottom:14px;}
.decide-note{font-size:11px;color:var(--text-faint);}
.decide-head-right{display:flex;align-items:center;gap:10px;}
.decide-wait{font-size:12px;font-weight:600;color:var(--text-muted);}
.decide-min{cursor:pointer;color:var(--text-faint);display:grid;place-items:center;}
.decide-min svg{stroke:var(--text-faint);stroke-width:2;fill:none;}
.decide-custom{display:flex;align-items:center;gap:8px;margin-top:12px;}
.decide-custom-box{flex:1;height:38px;border:1px solid var(--border);border-radius:11px;background:var(--bg-soft);display:flex;align-items:center;padding:0 12px;font-size:13px;}
.decide-sheet-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;}
.decide-foot-link{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--accent);font-weight:600;cursor:pointer;}
.decide-foot-link svg{stroke:var(--accent);stroke-width:2;fill:none;}
/* 最小化悬浮条 */
.decide-minibar{flex:0 0 auto;margin:0 12px 8px;background:#fff;border:1px solid var(--accent);border-radius:14px;box-shadow:0 4px 16px -6px rgba(22,25,30,.2);display:flex;align-items:center;gap:9px;padding:11px 14px;cursor:pointer;}
.decide-minibar .risk-badge{font-size:11px;flex:0 0 auto;}
.decide-minibar-txt{flex:1;font-size:13px;font-weight:650;color:var(--text);}
.decide-minibar-up{color:var(--accent);display:grid;place-items:center;transform:rotate(180deg);}
.decide-minibar-up svg{stroke:var(--accent);stroke-width:2.2;fill:none;}
/* ===== 使用手册·文章详情 ===== */
.help-lead{font-size:14px;color:var(--text-dim);line-height:1.7;margin-bottom:20px;}
.help-step{display:flex;gap:12px;margin-bottom:10px;}
.help-num{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;margin-top:1px;}
.help-body{flex:1;}
.help-h{font-size:15px;font-weight:700;color:var(--text);margin-bottom:3px;}
.help-p{font-size:13.5px;color:var(--text-muted);line-height:1.65;}
.help-shot{height:120px;border-radius:12px;background:var(--bg-soft);border:1px dashed var(--border-strong);display:grid;place-items:center;color:var(--text-faint);font-size:12.5px;margin:4px 0 18px 36px;}
.help-tip{display:flex;gap:8px;align-items:flex-start;background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--text-dim);line-height:1.6;margin:6px 0 16px;}
.help-tip svg{stroke:var(--accent);stroke-width:2;fill:none;flex:0 0 auto;margin-top:1px;}
.help-tip b{color:var(--accent);}
.help-related{font-size:12.5px;color:var(--text-muted);padding-top:8px;border-top:1px solid var(--border);}
/* ===== 手册迷你示意图（CSS 画的模拟界面）===== */
.mini-shot{display:flex;justify-content:center;background:var(--bg-soft);border:1px solid var(--border);border-radius:14px;padding:16px;margin:6px 0 18px 36px;}
.mini-phone{width:150px;background:#fff;border-radius:14px;border:1px solid var(--border);padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:7px;box-shadow:0 4px 14px -6px rgba(30,40,55,.18);}
.mini-logo{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--accent);border-right-color:var(--spark);}
.mini-title{font-size:12px;font-weight:800;color:var(--text);}
.mini-field{width:100%;height:20px;border-radius:7px;background:var(--bg-soft);border:1px solid var(--border);}
.mini-btn{width:100%;height:22px;border-radius:7px;background:var(--spark);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;}
.mini-oauth{display:flex;gap:14px;margin-top:2px;}
.mini-oauth span{width:20px;height:20px;border-radius:50%;background:var(--bg-raised);}
.mini-label{align-self:flex-start;font-size:9.5px;font-weight:700;color:var(--text-muted);margin:2px 0;}
.mini-dev{width:100%;display:flex;align-items:center;gap:7px;border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:9px;padding:7px 8px;}
.mini-dev-ic{width:22px;height:22px;border-radius:6px;background:var(--accent);flex:0 0 auto;}
.mini-dev-txt{display:flex;flex-direction:column;line-height:1.3;}
.mini-dev-txt b{font-size:10px;color:var(--text);}
.mini-dev-txt em{font-size:8.5px;color:var(--green);font-style:normal;}
.mini-chat-row{width:100%;display:flex;align-items:center;gap:7px;background:var(--bg-soft);border-radius:8px;padding:6px 8px;font-size:10px;color:var(--text);}
.mini-ava{width:18px;height:18px;border-radius:5px;background:var(--accent);flex:0 0 auto;}
.mini-win{width:180px;background:#fff;border-radius:10px;border:1px solid var(--border);overflow:hidden;box-shadow:0 4px 14px -6px rgba(30,40,55,.18);}
.mini-win-bar{height:18px;background:var(--bg-raised);display:flex;align-items:center;gap:4px;padding:0 8px;}
.mini-win-bar i{width:7px;height:7px;border-radius:50%;background:var(--border-strong);}
.mini-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--border);}
.mini-row:last-child{border-bottom:none;}
.mini-row-t{font-size:10px;color:var(--text);}
.mini-row-v{font-size:9.5px;color:var(--text-muted);}
.mini-switch{width:26px;height:15px;border-radius:999px;background:var(--border-strong);position:relative;flex:0 0 auto;}
.mini-switch::after{content:'';position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff;}
.mini-switch.on{background:var(--accent);}
.mini-switch.on::after{left:13px;}
/* 手册 mock 补充元件 */
.mini-bubble-r{align-self:flex-end;background:var(--accent-soft);border-radius:9px;padding:5px 8px;font-size:9.5px;color:var(--text);max-width:85%;}
.mini-bubble-l{align-self:flex-start;background:var(--bg-soft);border-radius:9px;padding:5px 8px;font-size:9.5px;color:var(--text);max-width:90%;}
.mini-bubble-l b{color:var(--accent);margin-right:3px;}
.mini-tool{align-self:stretch;font-family:var(--mono);font-size:8.5px;color:var(--green);background:var(--code-bg);border-radius:6px;padding:4px 6px;}
.mini-foot{font-size:8.5px;color:var(--text-faint);text-align:center;}
.mini-sync{display:flex;align-items:center;gap:10px;}
.mini-sync-dev{font-size:11px;font-weight:700;color:var(--text);}
.mini-sync-arrow{font-size:16px;color:var(--accent);}
.mini-quota{align-self:stretch;display:flex;align-items:center;gap:6px;font-size:8.5px;color:var(--text-muted);}
.mini-quota span{width:40px;flex:0 0 auto;}
.mini-qbar{flex:1;height:5px;border-radius:3px;background:var(--bg-raised);overflow:hidden;}
.mini-qbar i{display:block;height:100%;background:var(--accent);}
.mini-pill{font-size:9px;color:var(--text);border:1px solid var(--border);border-radius:999px;padding:4px 10px;}
.mini-coin{font-size:9.5px;color:var(--spark);font-weight:600;}
.mini-wallet{display:flex;flex-direction:column;align-items:center;gap:2px;}
.mini-wallet em{font-size:8.5px;color:var(--text-muted);font-style:normal;}
.mini-wallet b{font-size:22px;color:var(--text);}

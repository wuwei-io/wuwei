name: Verify macOS signing (no release)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare signing and validate notarization credentials
        run: node scripts/macos-release.mjs prepare
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Validate source and build desktop
        run: |
          npm run typecheck
          node scripts/test-release.mjs
          npm run desktop:build
      - name: Sign and notarize Intel and Apple Silicon packages
        run: npx electron-builder --mac --config electron-builder.wuwei.yml --publish never -c.forceCodeSigning=true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Verify actual ZIP and DMG payloads
        run: node scripts/macos-release.mjs verify
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      - name: Remove temporary credentials
        if: always()
        run: node scripts/macos-release.mjs cleanup
      # These are validation artifacts only. No OSS upload, update manifest
      # publication, tag creation, or GitHub Release modification occurs here.
      - uses: actions/upload-artifact@v4
        with:
          name: macos-signing-verification-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml

# push 一个 v* tag（如 git tag v1.1.0 && git push origin v1.1.0）即自动：
# macOS 双架构 DMG/ZIP 和 Windows EXE；Linux 暂停发版，保留上一版更新入口。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to finish publishing'
        required: true
      platforms:
        description: 'JSON array of build runner platforms'
        required: true
        default: '["macos-latest", "windows-latest"]'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms || '["macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify release tag matches package version
        run: node -e "if ('v' + require('./package.json').version !== process.env.RELEASE_TAG) throw new Error('Release tag must match package version')"
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Same Apple team as the mobile app. A Developer ID Application certificate
      # is required for direct macOS distribution; iOS certificates cannot sign it.
      - name: Prepare macOS signing and validate notarization credentials
        if: matrix.os == 'macos-latest'
        run: node scripts/macos-release.mjs prepare
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Validate images, model vision and asynchronous task reports
        run: |
          npm run typecheck
          node scripts/test-release.mjs

      - name: Repair electron-builder temporary keychain password
        if: matrix.os == 'macos-latest'
        run: node scripts/fix-macos-keychain.mjs

      - name: Build renderer/main
        run: npm run desktop:build
      - name: Verify mobile remote protocol and bundled adapters
        run: node --test tests/mobile-remote.test.cjs

      # Generate GitHub-compatible generic update manifests; publish only after all platforms finish.
      - name: Package Linux (AppImage/deb)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --config electron-builder.wuwei.yml --publish never

      - name: Package macOS (dmg + zip)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --config electron-builder.wuwei.yml --publish never -c.forceCodeSigning=true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # Verify the actual downloaded payloads, not just the unpacked build folder.
      # This runs before staging or publishing any release payload.
      - name: Verify macOS signatures and notarization tickets (both architectures)
        if: matrix.os == 'macos-latest'
        run: node scripts/macos-release.mjs verify
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

      - name: Remove temporary Apple credentials
        if: always() && matrix.os == 'macos-latest'
        run: node scripts/macos-release.mjs cleanup

      # Windows 代码签名，三档优先级（互斥，从上到下命中即用）：
      #   1) EVSIGN_KEY 已配置       → EV Sign(evsign.cn) 云签名。下载 CLI，用 build/evsign.js 钩子
      #                                (electron-builder 26 字段 = win.signtoolOptions.sign，非老的 win.sign)
      #                                在打包过程中逐个文件签名(见该文件注释：保证 latest.yml 的 sha512 正确)。
      #   2) AZURE_TS_ENDPOINT 已配置 → Azure Trusted Signing（electron-builder 26 原生支持）。
      #   3) 都没配(默认)            → 打未签名包，行为与接入前完全一致，绝不破坏发版。
      # EV Sign 只需 1 个 secret：EVSIGN_KEY（许可证 UUID）。Azure 需 7 项 AZURE_*。
      - name: Package Windows (exe)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $common = @('--win', '--config', 'electron-builder.wuwei.yml', '--publish', 'never')
          if ($env:EVSIGN_KEY) {
            Write-Host 'EV Sign 已配置 -> 下载 CLI 并打云签名包'
            $cli = Join-Path $env:RUNNER_TEMP 'evsign-client.exe'
            # evsign.cn 在国内、GitHub runner 在境外，下载可能慢：给 120s 超时 + 重试一次
            $ok = $false
            foreach ($i in 1..2) {
              try {
                Invoke-WebRequest -Uri 'https://mc.evsign.cn/evsign-client-cli-windows-latest' -OutFile $cli -TimeoutSec 120 -UseBasicParsing
                if ((Get-Item $cli).Length -gt 0) { $ok = $true; break }
              } catch { Write-Host "download evsign-client attempt $i failed: $_" }
            }
            if (-not $ok) { Write-Error 'evsign-client CLI 下载失败，中止发版（避免发出未签名包）'; exit 1 }
            $env:EVSIGN_CLIENT = $cli
            npx electron-builder @common '-c.win.signtoolOptions.sign=build/evsign.cjs'
            if ($LASTEXITCODE -ne 0) { Write-Error 'electron-builder 打包失败'; exit 1 }
            # electron-builder 对"签名失败"只跳过不报错(queue continue)，会静默产出未签名包。
            # 打包后强制验签：安装包必须是 Valid 签名，否则中止发版(绝不发未签名却以为已签的包)。
            $setup = Get-ChildItem release\*-setup.exe | Select-Object -First 1
            $sig = Get-AuthenticodeSignature $setup.FullName
            Write-Host "验签 $($setup.Name): $($sig.Status)"
            if ($sig.Status -ne 'Valid') { Write-Error "签名校验失败($($sig.Status))，中止发版"; exit 1 }
            Write-Host "签名有效，签发者: $($sig.SignerCertificate.Subject)"
          } elseif ($env:AZURE_TS_ENDPOINT) {
            Write-Host 'Azure Trusted Signing 已配置 -> 打签名包'
            npx electron-builder @common `
              "-c.win.azureSignOptions.endpoint=$env:AZURE_TS_ENDPOINT" `
              "-c.win.azureSignOptions.codeSigningAccountName=$env:AZURE_TS_ACCOUNT" `
              "-c.win.azureSignOptions.certificateProfileName=$env:AZURE_TS_PROFILE" `
              "-c.win.azureSignOptions.publisherName=$env:AZURE_PUBLISHER_NAME"
          } else {
            Write-Host '未配置任何签名 -> 打未签名包（行为同接入前）'
            npx electron-builder @common
          }
        env:
          EVSIGN_KEY: ${{ secrets.EVSIGN_KEY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
          AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
          AZURE_TS_PROFILE: ${{ secrets.AZURE_TS_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}

      - name: Verify packaged Windows renderer, sidebar and language shortcut
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          node scripts/verify-packaged-renderer.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-client-flows.mjs .qa-release-sidebar
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          WUWEI_QA_BUILT_RENDERER: '1'
          WUWEI_QA_FILTER: '发布关键'

      # Stage all signed platform payloads. No installer upload to OSS/R2.
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: wuwei-production-downloads
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-release-*
          merge-multiple: true
          path: release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pyyaml oss2 boto3
      - run: python -m unittest discover -s tests -p 'test_github_release.py'
      - name: Publish complete GitHub release, then update legacy manifests
        run: python scripts/github-release.py publish --tag "$RELEASE_TAG" --platforms windows macos
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: previous-update-manifests
          path: compatibility-backup/
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove temporary build artifacts after verified publication
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name | startswith("signed-release-")) | .id')
          for id in $ids; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done
